name: RepoLens Architecture Docs
description: Scan a repository and publish architecture documentation with the published RepoLens npm package
author: Charl van Zyl
branding:
  icon: book-open
  color: blue
inputs:
  command:
    description: >
      RepoLens command. publish, demo, and doctor run the published npm package.
      comment posts one sticky architecture-diff pull request comment from this
      action's source (modules, files, dependencies, code-health delta, new hotspots).
      badge writes a shields.io code-health JSON endpoint and SVG from this action's source.
    required: false
    default: publish
  config:
    description: Path to the RepoLens config file, relative to the repository.
    required: false
    default: .repolens.yml
  node-version:
    description: Node.js version to set up before running RepoLens. For example 18, 20, or 22.
    required: false
    default: "20"
  pr-comment:
    description: >
      Set to true to post the architecture diff comment after publish, demo, or doctor.
      The comment is written by this action (not the published package) so the pull
      request gets one sticky comment. false skips it. command: comment always posts.
    required: false
    default: "false"
  badge-out:
    description: File path for the badge JSON when command is badge. The SVG is written beside it.
    required: false
    default: repolens-badge.json
  badge-url:
    description: >
      Public HTTPS URL of the badge JSON. Used in the shields.io markdown snippet
      when command is badge. shields.io fetches this URL. Leave empty to print a placeholder.
    required: false
    default: ""
  badge-link:
    description: URL the badge links to. Defaults to the RepoLens gallery when empty.
    required: false
    default: ""
  version:
    description: Published @chappibunny/repolens version to run with npx.
    required: false
    default: "1.15.2"
runs:
  using: composite
  steps:
    - name: Validate RepoLens action inputs
      shell: bash
      env:
        REPOLENS_COMMAND: ${{ inputs.command }}
        REPOLENS_CONFIG: ${{ inputs.config }}
        REPOLENS_NODE_VERSION: ${{ inputs.node-version }}
        REPOLENS_PR_COMMENT: ${{ inputs.pr-comment }}
        REPOLENS_VERSION: ${{ inputs.version }}
        REPOLENS_BADGE_OUT: ${{ inputs.badge-out }}
        REPOLENS_BADGE_URL: ${{ inputs.badge-url }}
        REPOLENS_BADGE_LINK: ${{ inputs.badge-link }}
      run: node "$GITHUB_ACTION_PATH/scripts/github-action.js" --check

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run RepoLens
      shell: bash
      env:
        REPOLENS_COMMAND: ${{ inputs.command }}
        REPOLENS_CONFIG: ${{ inputs.config }}
        REPOLENS_NODE_VERSION: ${{ inputs.node-version }}
        REPOLENS_PR_COMMENT: ${{ inputs.pr-comment }}
        REPOLENS_VERSION: ${{ inputs.version }}
        REPOLENS_BADGE_OUT: ${{ inputs.badge-out }}
        REPOLENS_BADGE_URL: ${{ inputs.badge-url }}
        REPOLENS_BADGE_LINK: ${{ inputs.badge-link }}
      run: node "$GITHUB_ACTION_PATH/scripts/github-action.js"
