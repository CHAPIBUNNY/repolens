name: RepoLens Architecture Docs
description: Scan a repository and publish architecture documentation with the published RepoLens npm package
author: Charl van Zyl
branding:
  icon: book-open
  color: blue
inputs:
  command:
    description: RepoLens command to run. One of publish, demo, or doctor.
    required: false
    default: publish
  config:
    description: Path to the RepoLens config file, relative to the repository.
    required: false
    default: .repolens.yml
  node-version:
    description: Node.js version to set up before running RepoLens. For example 18, 20, or 22.
    required: false
    default: "20"
  pr-comment:
    description: Set to true to allow the architecture diff pull request comment. false skips it even on pull_request.
    required: false
    default: "false"
  version:
    description: Published @chappibunny/repolens version to run with npx.
    required: false
    default: "1.14.2"
runs:
  using: composite
  steps:
    - name: Validate RepoLens action inputs
      shell: bash
      env:
        REPOLENS_COMMAND: ${{ inputs.command }}
        REPOLENS_CONFIG: ${{ inputs.config }}
        REPOLENS_NODE_VERSION: ${{ inputs.node-version }}
        REPOLENS_PR_COMMENT: ${{ inputs.pr-comment }}
        REPOLENS_VERSION: ${{ inputs.version }}
      run: node "$GITHUB_ACTION_PATH/scripts/github-action.js" --check

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run RepoLens
      shell: bash
      env:
        REPOLENS_COMMAND: ${{ inputs.command }}
        REPOLENS_CONFIG: ${{ inputs.config }}
        REPOLENS_NODE_VERSION: ${{ inputs.node-version }}
        REPOLENS_PR_COMMENT: ${{ inputs.pr-comment }}
        REPOLENS_VERSION: ${{ inputs.version }}
      run: node "$GITHUB_ACTION_PATH/scripts/github-action.js"
