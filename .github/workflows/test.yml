name: Test

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      # Vitest 5 declares Node ^22.12, ^24, or >=26. Rolldown still imports
      # util.styleText, so the runner does not start on Node 18. It does
      # start on Node 20. The library supports engines >= 18.
      - name: Run tests
        if: matrix.node != 18
        run: npm test

      - name: Run Node 18 runtime checks
        if: matrix.node == 18
        run: node --test scripts/node18-runtime.js
