name: Test

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      # Vitest 4 cannot start on Node 18 (rolldown imports util.styleText,
      # added in Node 20.12). The library still supports engines >= 18.
      - name: Run tests
        if: matrix.node != 18
        run: npm test

      - name: Run Node 18 runtime checks
        if: matrix.node == 18
        run: node --test scripts/node18-runtime.js
