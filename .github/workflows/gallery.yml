name: Gallery

# Rebuilds the static showcase and deploys it with GitHub Pages.
# Schedule: Monday 06:17 UTC. workflow_dispatch runs it on demand.
# Only the default branch publishes, so a branch dispatch cannot replace
# the live site.
#
# GitHub will not serve the site until Pages is switched on once:
# Settings → Pages → Build and deployment → Source: GitHub Actions.
# The workflow token cannot change that setting.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache repository clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gallery/.cache/repos
          key: gallery-clones-${{ hashFiles('gallery/repos.json') }}-${{ github.run_id }}
          restore-keys: |
            gallery-clones-${{ hashFiles('gallery/repos.json') }}-
            gallery-clones-

      - name: Build gallery
        env:
          REPOLENS_AI_ENABLED: "false"
          REPOLENS_TELEMETRY_ENABLED: "false"
          GALLERY_SITE_ORIGIN: https://chapibunny.github.io
          GALLERY_BASE_PATH: /repolens
        run: node gallery/build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: gallery/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
