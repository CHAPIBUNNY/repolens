name: RepoLens Release

on:
  push:
    tags:
      - "v*"

# Tag pushes (v*) publish to npm. NPM_TOKEN must be set under
# Settings → Secrets and variables → Actions before a tag will publish.
# id-token: write lets npm attach a provenance attestation. It is limited
# to the release job. There is no pull_request_target trigger.
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run dependency audit
        run: node scripts/audit-runtime.js
      
      - name: Scan for secrets in release
        run: |
          echo "Scanning for accidentally committed secrets..."
          
          # Check for common secret patterns (exclude test fixtures)
          if git grep -E "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[0-9A-Z]{16}|secret_[a-zA-Z0-9]{30,})" -- '*.js' '*.ts' '*.json' '*.yml' '*.yaml' ':!node_modules' ':!.git' ':!tests' 2>/dev/null; then
            echo "❌ Potential secrets found in code!"
            exit 1
          fi
          
          echo "✅ No secrets detected"

  release:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: chappibunny-repolens-*.tgz
          generate_release_notes: true

      - name: Verify npm token is set
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "❌ NPM_TOKEN secret is not set or is empty — add it under repo Settings → Secrets → Actions"
            exit 1
          fi
          echo "✅ NPM_TOKEN is present"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: |
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          on_npm() {
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if npm view "${pkg}@${ver}" version --prefer-online >/dev/null 2>&1; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep 10
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }
          if on_npm; then echo already published; exit 0; fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          if npm publish --provenance --access public; then
            exit 0
          fi
          if on_npm; then echo already published; exit 0; fi
          exit 1
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
