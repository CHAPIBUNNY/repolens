name: RepoLens Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: rm -rf node_modules package-lock.json && npm install

      - name: Run dependency audit
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=moderate || true
          
          # Fail on critical/high vulnerabilities
          AUDIT_RESULT=$(npm audit --audit-level=high --json || echo '{}')
          CRITICAL=$(echo $AUDIT_RESULT | jq -r '.metadata.vulnerabilities.critical // 0')
          HIGH=$(echo $AUDIT_RESULT | jq -r '.metadata.vulnerabilities.high // 0')
          
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ Found $CRITICAL critical and $HIGH high severity vulnerabilities"
            exit 1
          else
            echo "✅ No critical or high severity vulnerabilities found"
          fi
      
      - name: Scan for secrets in release
        run: |
          echo "Scanning for accidentally committed secrets..."
          
          # Check for common secret patterns (exclude test fixtures)
          if git grep -E "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[0-9A-Z]{16}|secret_[a-zA-Z0-9]{30,})" -- '*.js' '*.ts' '*.json' '*.yml' '*.yaml' ':!node_modules' ':!.git' ':!tests' 2>/dev/null; then
            echo "❌ Potential secrets found in code!"
            exit 1
          fi
          
          echo "✅ No secrets detected"

  release:
    needs: security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: rm -rf node_modules package-lock.json && npm install

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: repolens-*.tgz
          generate_release_notes: true

      - name: Verify npm token is set
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "❌ NPM_TOKEN secret is not set or is empty — add it under repo Settings → Secrets → Actions"
            exit 1
          fi
          echo "✅ NPM_TOKEN is present (length: ${#NODE_AUTH_TOKEN})"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
